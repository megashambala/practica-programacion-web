<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ekaitz Ibáñez">
    <title>Coches</title>
    <link rel="icon" type="image/png" href="img/stormlinemotors.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="coches.html"><img src="img/stormlinemotors.png" alt="StormLine Motors" height="100"></a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="coches.html">Coches</a></li>
                    <li class="nav-item"><a class="nav-link" href="mis_coches.html">Mis coches</a></li>
                    <li class="nav-item"><a class="nav-link" href="estadisticas.html">Estadísticas</a></li>
                </ul>

                <div class="d-flex align-items-center">
                    <span class="navbar-text me-3" id="nombreUsuario"></span>
                    <a href="carrito.html" class="text-white me-3"><i class="fa-solid fa-cart-shopping"></i></a>
                    <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="mb-4">Coches disponibles</h1>
    <div class="row g-2 mb-3">
        <div class="col-12 col-md-6">
            <input type="text" id="buscador" class="form-control"
                placeholder="Buscar por nombre..." oninput="aplicarFiltros()">
        </div>
        <div class="col-6 col-md-3">
            <select id="filtroCategoria" class="form-select" data-bs-theme="dark" onchange="aplicarFiltros()">
                <option value="">Todas las categorías</option>
                <option value="Segunda mano">Segunda mano</option>
                <option value="Km 0">Km 0</option>
                <option value="Nuevo">Nuevo</option>
            </select>
        </div>
        <div class="col-6 col-md-3">
            <select id="orden" class="form-select" data-bs-theme="dark" onchange="aplicarFiltros()">
                <option value="">Sin ordenar</option>
                <option value="asc">Precio: menor a mayor</option>
                <option value="desc">Precio: mayor a menor</option>
            </select>
        </div>
    </div>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Modelo</th>
                        <th>Descripción</th>
                        <th>Km</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Imagen</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpoCoches"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
