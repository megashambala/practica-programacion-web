<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ekaitz Ibáñez">
    <title>Agregar coche</title>
    <link rel="icon" type="image/png" href="img/stormlinemotors.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="coches.html"><img src="img/stormlinemotors.png" alt="StormLine Motors" height="100"></a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="coches.html">Coches</a></li>
                    <li class="nav-item"><a class="nav-link active" href="mis_coches.html">Mis coches</a></li>
                    <li class="nav-item"><a class="nav-link" href="estadisticas.html">Estadísticas</a></li>
                </ul>

                <div class="d-flex align-items-center">
                    <span class="navbar-text me-3" id="nombreUsuario"></span>
                    <a href="carrito.html" class="text-white me-3"><i class="fa-solid fa-cart-shopping"></i></a>
                    <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card mt-4 mb-5">
                    <div class="card-body p-4">
                        <h2 class="text-center">Agregar coche</h2>

                        <div id="mensaje"></div>

                        <form onsubmit="agregarCoche(event)">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Modelo</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" id="descripcion" rows="3" required></textarea>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label for="precio" class="form-label">Precio (€)</label>
                                    <input type="number" class="form-control" id="precio" min="0" step="any" required>
                                </div>
                                <div class="col-6 mb-3">
                                    <label for="km" class="form-label">Km totales</label>
                                    <input type="number" class="form-control" id="km" min="0" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="categoria" class="form-label">Categoría</label>
                                <select class="form-select" id="categoria" data-bs-theme="dark" required>
                                    <option value="Segunda mano">Segunda mano</option>
                                    <option value="Km 0">Km 0</option>
                                    <option value="Nuevo">Nuevo</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="imagen" class="form-label">Imagen (URL)</label>
                                <input type="url" class="form-control" id="imagen" required>
                                <div class="form-text text-white-50"></div>
                            </div>
                            <button type="submit" class="btn btn-oro w-100">Publicar coche</button>
                            <a href="mis_coches.html" class="btn btn-outline-light w-100 mt-2">Cancelar</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
