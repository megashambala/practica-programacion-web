<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ekaitz Ibáñez">
    <title>Registro</title>
    <link rel="icon" type="image/png" href="img/stormlinemotors.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card mt-5 mb-5">
                    <div class="card-body p-4">
                        <h2 class="text-center">Crear cuenta</h2>

                        <div id="mensaje"></div>

                        <form action="login.html">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre de usuario</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label for="latitud" class="form-label">Latitud</label>
                                    <input type="number" step="any" class="form-control" id="latitud" required>
                                </div>
                                <div class="col-6 mb-3">
                                    <label for="longitud" class="form-label">Longitud</label>
                                    <input type="number" step="any" class="form-control" id="longitud" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirmacion" class="form-label">Confirmar contraseña</label>
                                <input type="password" class="form-control" id="confirmacion" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Registrarse</button>
                        </form>

                        <p class="text-center mt-3 mb-0">
                            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
